name: Build and Submit to App Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then
          sudo xcode-select -s "/Applications/$XCODE_APP"
        fi
        xcodebuild -version

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build iOS Framework
      run: ./gradlew :composeApp:assembleComposeAppReleaseXCFramework -x test || ./gradlew :composeApp:assembleReleaseXCFramework -x test || ./gradlew :composeApp:linkReleaseFrameworkIosArm64 -x test

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set build number
      run: |
        BUILD_NUM=${{ github.run_number }}
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: [0-9]*/CURRENT_PROJECT_VERSION: $BUILD_NUM/" iosApp/project.yml
        sed -i "" "/<key>CFBundleVersion<\/key>/{n;s|<string>[^<]*</string>|<string>$BUILD_NUM</string>|;}" iosApp/iosApp/Info.plist

    - name: Locate framework
      run: |
        FRAMEWORK_PATH=$(find composeApp/build -name "ComposeApp.xcframework" -type d 2>/dev/null | head -1)
        if [ -z "$FRAMEWORK_PATH" ]; then
          FRAMEWORK_PATH=$(find composeApp/build -name "ComposeApp.framework" -type d 2>/dev/null | head -1)
        fi
        echo "Framework: $FRAMEWORK_PATH"
        echo "FRAMEWORK_PATH=$FRAMEWORK_PATH" >> $GITHUB_ENV

    - name: Update project.yml framework path
      run: |
        if [ -n "$FRAMEWORK_PATH" ]; then
          ABS_PATH="$(pwd)/$FRAMEWORK_PATH"
          sed -i "" "s|framework:.*ComposeApp.*|framework: $ABS_PATH|" iosApp/project.yml
        fi
        cat iosApp/project.yml

    - name: Generate Xcode project
      run: cd iosApp && xcodegen generate

    - name: Import Distribution Certificate
      env:
        CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        echo "$CERT_BASE64" | base64 -D > cert.p12
        security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        rm cert.p12

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Build Archive
      run: |
        cd iosApp
        xcodebuild archive \
          -scheme MangaNavi \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/MangaNavi.xcarchive \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Export IPA
      run: |
        cd iosApp
        xcodebuild -exportArchive \
          -archivePath build/MangaNavi.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export_options.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Install PyJWT
      run: pip3 install --break-system-packages PyJWT requests

    - name: Submit for Review
      env:
        ASC_KEY_ID: WDXGY9WX55
        ASC_ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec
        BUILD_NUMBER: ${{ env.BUILD_NUM }}
      run: |
        export ASC_PRIVATE_KEY=$(cat ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8)
        python3 scripts/submit.py
