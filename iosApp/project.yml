name: MangaNavi
options:
  bundleIdPrefix: com.mangaguide
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

targets:
  MangaNavi:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    dependencies:
      - framework: ../composeApp/build/XCFrameworks/release/ComposeApp.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mangaguide.manganavi
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        DEVELOPMENT_TEAM: 83VGKGSQUH
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: $(inherited) -ObjC -lc++
